name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: okamyuji/reusable-workflows/.github/workflows/rails-ci.yml@v1
    # 中央のlockfile-recreateジョブが、実行されないときでもpull-requests: writeを要求するため
    permissions:
      contents: read
      pull-requests: write
    with:
      with-mysql: true
      lint-command: "pipx run pre-commit==4.6.2 run --all-files --show-diff-on-failure"
      test-command: "RAILS_ENV=test DB_PASSWORD= bin/rails db:create db:schema:load && RAILS_ENV=test DB_PASSWORD= bin/rails quality"
  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
